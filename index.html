<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>RA Campus Anchieta</title>
  <script src="pontos.js?v=11"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
    /* Câmera ocupando a tela inteira, ao fundo */
    #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #camada { position: fixed; inset: 0; pointer-events: none; }
    #painel {
      position: fixed; top: 0; left: 0; right: 0; z-index: 3000;
      background: rgba(0, 40, 90, .85); color: #fff; padding: 8px 12px; font-size: 14px;
    }
    #painel b { color: #ffd23f; }
    #detalhe { font-size: 12px; margin-top: 3px; opacity: .9; }

    /* Marcador: nome e distância em cima, pino embaixo */
    .marcador { position: absolute; text-align: center; transform-origin: 50% 100%; }
    .marcador .nome {
      background: rgba(0, 40, 90, .9); color: #fff; font-weight: bold; white-space: nowrap;
      padding: 5px 10px; border-radius: 8px; font-size: 15px; display: inline-block;
    }
    .marcador .dist { display: block; font-size: 12px; font-weight: normal; color: #ffd23f; }
    .marcador img { display: block; margin: 4px auto 0; width: 56px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }

    /* Seta na borda para o que está fora da tela */
    .seta {
      position: absolute; z-index: 2000; background: rgba(214, 40, 40, .92); color: #fff;
      font-weight: bold; padding: 6px 10px; border-radius: 8px; font-size: 13px; white-space: nowrap;
    }
    .seta.esq { left: 6px; } .seta.dir { right: 6px; }

    #botaoModo {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 3000;
      background: rgba(0, 40, 90, .9); color: #fff; border: 2px solid #ffd23f; border-radius: 20px;
      padding: 10px 18px; font-size: 15px; font-weight: bold;
    }
    #inicio {
      position: fixed; inset: 0; z-index: 5000; background: #0b2a4a; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center; gap: 14px;
    }
    #inicio h1 { font-size: 22px; margin: 0; }
    #inicio img { width: 70px; }
    #inicio button { font-size: 20px; font-weight: bold; padding: 18px 28px; border: 0; border-radius: 10px;
                     background: #ffd23f; color: #0b2a4a; width: 100%; max-width: 320px; }
    #inicio .msg { font-size: 15px; min-height: 3em; color: #ffd23f; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="camada"></div>

  <div id="painel">
    <div id="status">Aguardando GPS...</div>
    <div id="detalhe"></div>
  </div>

  <button id="botaoModo"></button>

  <div id="inicio">
    <img src="modelos/pino.png" alt="">
    <h1>RA Campus Anchieta</h1>
    <p>Segure o celular <b>em pé</b> e gire devagar.<br>
       O app vai pedir <b>câmera</b>, <b>localização</b> e <b>movimento</b>: toque em <b>Permitir</b>.</p>
    <button id="btnIniciar">INICIAR</button>
    <div class="msg" id="msgInicio"></div>
  </div>

<script>
// =====================================================================================
// RA markerless por localização (como um "Maps" na câmera):
//   GPS     -> onde estou
//   Bússola -> para onde a câmera aponta
//   Para cada ponto: calcula direção (azimute) e distância.
//   - Dentro do campo de visão: desenha o pino com nome e distância naquele ponto da tela
//     (menor quando longe, maior quando perto).
//   - Fora do campo de visão: seta na borda (◀ ou ▶) mostrando para que lado virar.
//   Longe do campus (> 1 km) aparece um pino só, "UniAnchieta"; perto, um por prédio
//   (separa sozinho ao chegar). O botão embaixo alterna entre os dois.
// =====================================================================================
const RUMO_FIXO = new URLSearchParams(location.search).get("rumo");  // só para testar no PC

const status = document.getElementById("status");
const detalhe = document.getElementById("detalhe");
const camada = document.getElementById("camada");
const botaoModo = document.getElementById("botaoModo");
// Alterna entre "todos os prédios" e "só a faculdade"
botaoModo.onclick = () => {
  modo = botaoModo.textContent.startsWith("Mostrar todos") ? "todos" : "campus";
};

let posicao = null;   // { lat, lon, prec }
let rumo = null;      // para onde a câmera aponta (0 = norte, 90 = leste)
let inclinacao = 0;    // quanto a câmera aponta para cima (+) ou para baixo (-), em graus
let ultimaBussola = 0;
let modo = "auto";    // "auto" (longe: faculdade; perto: prédios), "todos" ou "campus"

// ---------------------------------------------------------------- matemática
const rad = (g) => g * Math.PI / 180, grau = (r) => r * 180 / Math.PI;

// Direção de A para B em graus a partir do norte, no sentido horário
function azimute(lat1, lon1, lat2, lon2) {
  const y = Math.sin(rad(lon2 - lon1)) * Math.cos(rad(lat2));
  const x = Math.cos(rad(lat1)) * Math.sin(rad(lat2)) -
            Math.sin(rad(lat1)) * Math.cos(rad(lat2)) * Math.cos(rad(lon2 - lon1));
  return (grau(Math.atan2(y, x)) + 360) % 360;
}
// Diferença entre ângulos, de -180 a 180 (negativo = à esquerda)
const diferenca = (a, b) => ((a - b + 540) % 360) - 180;

// Para onde a câmera traseira aponta, a partir dos sensores (fórmula da W3C)
function rumoDaCamera(alpha, beta, gamma) {
  const x = rad(beta || 0), y = rad(gamma || 0), z = rad(alpha || 0);
  const Vx = -Math.cos(z) * Math.sin(y) - Math.sin(z) * Math.sin(x) * Math.cos(y);
  const Vy = -Math.sin(z) * Math.sin(y) + Math.cos(z) * Math.sin(x) * Math.cos(y);
  let h = Math.atan(Vx / Vy);
  if (Vy < 0) h += Math.PI; else if (Vx < 0) h += 2 * Math.PI;
  return grau(h);
}

const textoDistancia = (d) =>
  d >= 1000 ? (d / 1000).toFixed(1).replace(".", ",") + " km" : Math.round(d) + " m";

// ---------------------------------------------------------------- bússola
function novaLeitura(h, beta) {
  if (h == null || isNaN(h)) return;
  ultimaBussola = Date.now();
  // filtro leve (média circular): tira a tremida sem atrasar o movimento
  rumo = rumo == null ? h : (rumo + diferenca(h, rumo) * 0.35 + 360) % 360;
  // celular em pé: beta ≈ 90°. Acima disso a câmera aponta para cima.
  if (beta != null) inclinacao += ((beta - 90) - inclinacao) * 0.35;
}
function ligarBussola() {
  if (RUMO_FIXO != null) { rumo = +RUMO_FIXO; return; }
  window.addEventListener("deviceorientation", (e) => {          // iPhone
    if (e.webkitCompassHeading != null) novaLeitura(e.webkitCompassHeading, e.beta);
    else if (e.absolute) novaLeitura(rumoDaCamera(e.alpha, e.beta, e.gamma), e.beta);
  });
  window.addEventListener("deviceorientationabsolute", (e) => {  // Android
    novaLeitura(rumoDaCamera(e.alpha, e.beta, e.gamma), e.beta);
  });
}

// ---------------------------------------------------------------- GPS
function ligarGPS(primeira) {
  const usar = (p) => { posicao = { lat: p.coords.latitude, lon: p.coords.longitude, prec: p.coords.accuracy }; };
  if (primeira) usar(primeira);
  const ler = () => navigator.geolocation.getCurrentPosition(usar, (e) => {
    if (!posicao) status.textContent = "Erro de GPS: " +
      ({ 1: "localização bloqueada (cadeado → Permissões → Localização)",
         2: "ligue a localização do celular", 3: "GPS demorou; vá para um lugar aberto" }[e.code] || e.message);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  ler(); setInterval(ler, 3000);
}

// ---------------------------------------------------------------- marcadores
// Um elemento (pino + seta) por ponto, criado uma vez e reaproveitado
const elementos = new Map();
function elementoDe(ponto) {
  if (!elementos.has(ponto.nome)) {
    const el = document.createElement("div");
    el.className = "marcador";
    el.innerHTML = `<span class="nome">${ponto.nome}<span class="dist"></span></span><img src="modelos/pino.png" alt="">`;
    const seta = document.createElement("div");
    seta.className = "seta";
    camada.append(el, seta);
    elementos.set(ponto.nome, { el, seta });
  }
  return elementos.get(ponto.nome);
}

// ---------------------------------------------------------------- desenho (a cada quadro)
function desenhar() {
  requestAnimationFrame(desenhar);
  if (!posicao) return;

  const W = innerWidth, H = innerHeight;
  const campo = W < H ? 55 : 75;   // campo de visão horizontal aproximado da câmera (graus)
  const semBussola = rumo == null || (RUMO_FIXO == null && Date.now() - ultimaBussola > 3000);
  // Campo de visão vertical a partir do horizontal e do formato da tela
  const campoV = grau(2 * Math.atan(Math.tan(rad(campo / 2)) * H / W));
  // Linha do horizonte na tela: sobe quando a câmera aponta para baixo e desce quando
  // aponta para cima. Os pinos ficam presos nela, como se estivessem no prédio.
  const horizonte = H / 2 + (inclinacao / (campoV / 2)) * (H / 2);

  // Automático: longe só a faculdade, perto cada prédio. O botão pode forçar um dos dois.
  const dCampus = distanciaMetros(posicao.lat, posicao.lon, CAMPUS.lat, CAMPUS.lon);
  const soCampus = modo === "campus" || (modo === "auto" && dCampus > DISTANCIA_SEPARAR_PREDIOS);
  const ativos = soCampus ? [CAMPUS] : PONTOS;
  botaoModo.textContent = soCampus ? "Mostrar todos os prédios" : "Mostrar só a faculdade";

  // esconde o que não está ativo
  elementos.forEach((v, nome) => {
    if (!ativos.some((p) => p.nome === nome)) { v.el.style.display = "none"; v.seta.style.display = "none"; }
  });

  const itens = ativos.map((p) => ({
    p, ...elementoDe(p),
    d: distanciaMetros(posicao.lat, posicao.lon, p.lat, p.lon),
    az: azimute(posicao.lat, posicao.lon, p.lat, p.lon),
  })).sort((a, b) => a.d - b.d);

  let esq = 0, dir = 0;
  const visiveis = [];
  itens.forEach((it) => {
    it.el.querySelector(".dist").textContent = textoDistancia(it.d);
    if (semBussola) { it.el.style.display = "none"; it.seta.style.display = "none"; return; }
    const dif = diferenca(it.az, rumo);
    if (Math.abs(dif) <= campo / 2) {
      it.x = W / 2 + (dif / (campo / 2)) * (W / 2);   // posição horizontal proporcional ao ângulo
      visiveis.push(it);
      it.seta.style.display = "none";
    } else {
      it.el.style.display = "none";
      const lado = dif < 0 ? "esq" : "dir";
      const n = lado === "esq" ? esq++ : dir++;
      it.seta.className = "seta " + lado;
      it.seta.style.display = "block";
      it.seta.style.top = (70 + n * 38) + "px";
      it.seta.textContent = lado === "esq"
        ? `◀ ${it.p.nome} · ${textoDistancia(it.d)}` : `${it.p.nome} · ${textoDistancia(it.d)} ▶`;
    }
  });

  // Da esquerda para a direita: cada nome vai para o primeiro "degrau" livre,
  // assim prédios na mesma direção (comum de longe) ficam empilhados sem se cobrir.
  // Tamanho: grande perto (≈100 m), pequeno longe (vários km).
  const degraus = [];   // borda direita ocupada em cada degrau
  visiveis.sort((a, b) => a.x - b.x).forEach((it) => {
    const escala = Math.max(0.5, Math.min(1.3, 1.3 - Math.log10(Math.max(it.d, 50) / 50) * 0.35));
    it.el.style.display = "block";
    const largura = it.el.querySelector(".nome").offsetWidth * escala;
    const altura = it.el.querySelector(".nome").offsetHeight * escala;
    let n = degraus.findIndex((dir) => it.x - largura / 2 > dir + 6);
    if (n === -1) { n = degraus.length; degraus.push(0); }
    degraus[n] = it.x + largura / 2;
    it.el.style.left = it.x + "px";
    it.el.style.top = (horizonte - n * (altura + 8)) + "px";
    it.el.style.transform = `translate(-50%, -100%) scale(${escala})`;
    it.el.style.zIndex = String(50 - n);   // o de baixo fica por cima: nenhum nome some
  });

  const prec = posicao.prec != null ? ` ±${Math.round(posicao.prec)} m` : "";
  status.innerHTML = `GPS${prec} — <b>${itens[0].p.nome}</b> a ${textoDistancia(itens[0].d)}`;
  detalhe.textContent = semBussola
    ? "Bússola sem resposta: mexa o celular em 8; no Android, libere 'Sensores de movimento' do site."
    : `Apontando para ${Math.round(rumo)}° · ${visiveis.length} na tela`;
}

// ---------------------------------------------------------------- botão INICIAR
const msg = document.getElementById("msgInicio");
document.getElementById("btnIniciar").onclick = async () => {
  // 1. Movimento/bússola (o iPhone só pergunta dentro de um toque)
  try {
    if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
      await DeviceOrientationEvent.requestPermission();
    }
  } catch (e) { /* segue */ }

  // 2. Câmera traseira
  msg.textContent = "Abrindo a câmera...";
  try {
    document.getElementById("video").srcObject =
      await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
  } catch (e) {
    msg.textContent = "Câmera bloqueada (" + e.name + "). Libere no cadeado ao lado do endereço e recarregue.";
    return;
  }

  // 3. Localização
  msg.textContent = "Pedindo a localização...";
  navigator.geolocation.getCurrentPosition((p) => {
    document.getElementById("inicio").remove();
    ligarBussola(); ligarGPS(p); desenhar();
  }, (e) => {
    msg.textContent = ({
      1: "Localização bloqueada. Toque no cadeado ao lado do endereço → Permissões → Localização → Permitir. Depois recarregue.",
      2: "Localização indisponível. Ligue a localização (GPS) do celular e tente de novo.",
      3: "A localização demorou. Vá para perto de uma janela e toque em INICIAR de novo." }[e.code] || e.message);
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
};
</script>
</body>
</html>
