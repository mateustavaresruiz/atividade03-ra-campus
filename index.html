<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>RA Campus Anchieta</title>

  <!-- A-Frame (cena 3D), AR.js (RA por GPS) e o carregador de FBX do three.js -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/libs/fflate.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/curves/NURBSUtils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/curves/NURBSCurve.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/loaders/FBXLoader.js"></script>

  <script src="pontos.js?v=6"></script>
  <script src="componentes.js?v=6"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #painel {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      background: rgba(0, 40, 90, .85); color: #fff; padding: 8px 12px; font-size: 14px;
    }
    #painel b { color: #ffd23f; }
    #lista { font-size: 12px; margin-top: 4px; opacity: .9; }
    #rodape {
      position: fixed; bottom: 10px; left: 0; right: 0; z-index: 10; text-align: center;
    }
    #rodape a {
      background: rgba(0,0,0,.6); color: #fff; padding: 6px 10px; border-radius: 6px;
      text-decoration: none; font-size: 13px; margin: 0 4px;
    }
    /* Tela inicial: o toque no botão é o que libera os pedidos de permissão */
    #inicio {
      position: fixed; inset: 0; z-index: 20; background: #0b2a4a; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center; gap: 14px;
    }
    #inicio h1 { font-size: 22px; margin: 0; }
    #inicio button {
      font-size: 20px; font-weight: bold; padding: 18px 28px; border: 0; border-radius: 10px;
      background: #ffd23f; color: #0b2a4a; width: 100%; max-width: 320px;
    }
    #inicio .msg { font-size: 15px; min-height: 3em; color: #ffd23f; }
  </style>
</head>
<body>
  <div id="inicio">
    <h1>RA Campus Anchieta</h1>
    <p>O app vai pedir <b>localização</b>, <b>câmera</b> e <b>movimento</b>.<br>Toque em <b>Permitir</b> em todos.</p>
    <button id="btnIniciar">INICIAR</button>
    <div class="msg" id="msgInicio"></div>
    <small>v6</small>
  </div>

  <div id="painel">
    <div id="status">v6 — Aguardando GPS...</div>
    <div id="lista"></div>
  </div>
  <div id="rodape">
    <a href="index.html">Campus</a>
    <a href="index.html?teste=1">Modo teste</a>
    <a href="calibrar.html">Calibrar</a>
  </div>

  <!-- A cena só entra na página depois do botão INICIAR (ver script abaixo) -->
  <template id="cena">
    <a-scene
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: false; debugUIEnabled: false"
      renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true"
      gerenciador-pontos>
      <a-camera gps-new-camera="gpsMinDistance: 3" far="5000"></a-camera>
      <a-light type="ambient" intensity="0.9"></a-light>
      <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>
    </a-scene>
  </template>

  <script>
    const msg = document.getElementById("msgInicio");

    function abrirCena() {
      document.body.appendChild(document.getElementById("cena").content.cloneNode(true));
      document.getElementById("inicio").remove();
    }

    document.getElementById("btnIniciar").onclick = async () => {
      // 1. Movimento/bússola (o iPhone só pergunta se for dentro de um toque)
      try {
        if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
          await DeviceOrientationEvent.requestPermission();
        }
      } catch (e) { /* segue mesmo assim */ }

      // 2. Câmera
      msg.textContent = "Pedindo a câmera...";
      try {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        s.getTracks().forEach((t) => t.stop());
      } catch (e) {
        msg.textContent = "Câmera bloqueada (" + e.name + "). Libere no cadeado ao lado do endereço e recarregue.";
        return;
      }

      // No modo simulado não precisa de GPS
      if (new URLSearchParams(location.search).has("simular")) return abrirCena();

      // 3. Localização
      msg.textContent = "Pedindo a localização... (pode levar alguns segundos)";
      if (!navigator.geolocation) { msg.textContent = "Este navegador não tem localização."; return; }
      navigator.geolocation.getCurrentPosition(
        (p) => { window.posicaoInicial = p; abrirCena(); },   // componentes.js usa esta posição
        (e) => {
          msg.textContent = {
            1: "Localização bloqueada. Toque no cadeado ao lado do endereço → Permissões → Localização → Permitir. Depois recarregue.",
            2: "Localização indisponível. Ligue a localização (GPS) do celular e tente de novo.",
            3: "A localização demorou. Vá para perto de uma janela e toque em INICIAR de novo.",
          }[e.code] || e.message;
        },
        { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
    };
  </script>
</body>
</html>
