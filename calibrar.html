<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calibrar pontos</title>
  <script src="pontos.js?v=4"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 12px; background: #0b2a4a; color: #fff; }
    h1 { font-size: 20px; } .gps { background: #133f6b; padding: 10px; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
    td { padding: 6px 4px; border-bottom: 1px solid #2c5a88; }
    button { background: #ffd23f; border: 0; padding: 8px 10px; border-radius: 6px; font-weight: bold; }
    .aviso { color: #ffb4a2; } a { color: #ffd23f; }
    textarea { width: 100%; height: 160px; margin-top: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Calibrar pontos no campus</h1>
  <p>Fique na frente de cada prédio e toque em <b>Salvar aqui</b>. As posições ficam
     guardadas neste celular e o app passa a usá-las.</p>
  <div class="gps" id="gps">Aguardando GPS...</div>
  <table id="tabela"></table>
  <p id="avisos" class="aviso"></p>
  <button onclick="restaurar()">Voltar aos valores do mapa</button>
  <a href="index.html" style="margin-left:12px">Abrir o app</a>
  <textarea id="codigo" readonly></textarea>

<script>
let pontos = carregarPontos().map((p) => ({ ...p }));
let atual = null;

navigator.geolocation.watchPosition((pos) => {
  atual = { lat: pos.coords.latitude, lon: pos.coords.longitude, prec: pos.coords.accuracy };
  document.getElementById("gps").textContent =
    `Você: ${atual.lat.toFixed(6)}, ${atual.lon.toFixed(6)} (precisão ±${Math.round(atual.prec)} m)`;
  desenhar();
}, (e) => { document.getElementById("gps").textContent = "Erro de GPS: " + e.message; },
{ enableHighAccuracy: true, maximumAge: 0 });

function salvar(i) {
  if (!atual) return alert("Ainda sem GPS.");
  if (atual.prec > 25 && !confirm(`Precisão ruim (±${Math.round(atual.prec)} m). Salvar mesmo assim?`)) return;
  pontos[i].lat = +atual.lat.toFixed(6); pontos[i].lon = +atual.lon.toFixed(6);
  try { localStorage.setItem("pontos_calibrados", JSON.stringify(pontos)); } catch (e) {}
  desenhar();
}
function restaurar() {
  try { localStorage.removeItem("pontos_calibrados"); } catch (e) {}
  pontos = PONTOS.map((p) => ({ ...p })); desenhar();
}
function desenhar() {
  document.getElementById("tabela").innerHTML = pontos.map((p, i) => {
    const d = atual ? Math.round(distanciaMetros(atual.lat, atual.lon, p.lat, p.lon)) + " m" : "";
    return `<tr><td><b>${p.nome}</b><br><small>${p.lat}, ${p.lon}</small></td>
            <td>${d}</td><td><button onclick="salvar(${i})">Salvar aqui</button></td></tr>`;
  }).join("");
  // Avisa pares de pontos com menos de 50 m entre si
  const avisos = [];
  for (let i = 0; i < pontos.length; i++)
    for (let j = i + 1; j < pontos.length; j++) {
      const d = distanciaMetros(pontos[i].lat, pontos[i].lon, pontos[j].lat, pontos[j].lon);
      if (d < 50) avisos.push(`${pontos[i].nome} e ${pontos[j].nome}: ${Math.round(d)} m`);
    }
  document.getElementById("avisos").textContent = avisos.length ? "Menos de 50 m: " + avisos.join("; ") : "";
  document.getElementById("codigo").value = "const PONTOS = " + JSON.stringify(pontos, null, 2) + ";";
}
desenhar();
</script>
</body>
</html>
