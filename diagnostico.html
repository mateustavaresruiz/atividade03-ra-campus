<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnóstico</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 14px; background: #0b2a4a; color: #fff; font-size: 17px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    .item { background: #133f6b; border-radius: 8px; padding: 10px; margin: 8px 0; }
    .ok { color: #7CFC9A; } .erro { color: #ff8a80; } .esp { color: #ffd23f; }
    button { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; border: 0; border-radius: 8px; background: #ffd23f; }
    small { opacity: .8; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Diagnóstico do app de RA</h1>
  <button id="btn">TOCAR AQUI PARA TESTAR</button>
  <div id="res"></div>
  <p><small id="ua"></small></p>

<script>
const res = document.getElementById("res");
document.getElementById("ua").textContent = navigator.userAgent;
function linha(nome, estado, texto) {
  const id = "l_" + nome.replace(/\W/g, "");
  let d = document.getElementById(id);
  if (!d) { d = document.createElement("div"); d.id = id; d.className = "item"; res.appendChild(d); }
  const cls = estado === "ok" ? "ok" : estado === "erro" ? "erro" : "esp";
  const sim = estado === "ok" ? "✔" : estado === "erro" ? "✘" : "…";
  d.innerHTML = `<b>${nome}</b>: <span class="${cls}">${sim} ${texto}</span>`;
}

// Testes que não precisam de toque
linha("Site seguro (HTTPS)", window.isSecureContext ? "ok" : "erro",
  window.isSecureContext ? "sim" : "não — câmera e GPS ficam bloqueados");
const navInterno = /FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)/i.test(navigator.userAgent);
linha("Navegador", navInterno ? "erro" : "ok",
  navInterno ? "navegador interno de app (WhatsApp/Instagram). Abra no Chrome ou Safari" : "normal");
try {
  const gl = document.createElement("canvas").getContext("webgl");
  linha("3D (WebGL)", gl ? "ok" : "erro", gl ? "funciona" : "não suportado");
} catch (e) { linha("3D (WebGL)", "erro", e.message); }

document.getElementById("btn").onclick = async () => {
  // Câmera
  linha("Câmera", "esp", "pedindo permissão...");
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    s.getTracks().forEach((t) => t.stop());
    linha("Câmera", "ok", "funciona");
  } catch (e) { linha("Câmera", "erro", `${e.name}: ${e.message}`); }

  // Sensores de movimento (bússola/giroscópio)
  try {
    if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) {
      const r = await DeviceOrientationEvent.requestPermission();   // iPhone
      linha("Sensores", r === "granted" ? "ok" : "erro", "permissão: " + r);
    } else {
      linha("Sensores", "esp", "aguardando leitura... (mexa o celular)");
    }
    let recebeu = false;
    window.addEventListener("deviceorientation", (ev) => {
      if (!recebeu && ev.alpha !== null) { recebeu = true; linha("Sensores", "ok", "bússola respondendo"); }
    });
    setTimeout(() => { if (!recebeu) linha("Sensores", "erro", "nenhuma leitura da bússola"); }, 5000);
  } catch (e) { linha("Sensores", "erro", e.message); }

  // GPS
  linha("GPS", "esp", "procurando... (pode levar até 30 s)");
  navigator.geolocation.getCurrentPosition(
    (p) => linha("GPS", "ok", `±${Math.round(p.coords.accuracy)} m (${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)})`),
    (e) => linha("GPS", "erro", ["", "permissão negada", "indisponível (GPS desligado?)", "demorou demais"][e.code] || e.message),
    { enableHighAccuracy: true, timeout: 30000 });
};
</script>
</body>
</html>
